name: Build storefront
on:
  push:
    branches: [main, preview/supabase-config, feature/customer-auth-cart, fix/made-to-order-checkout]
  pull_request:
    branches: [main, preview/supabase-config]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
